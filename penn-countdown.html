<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Penn T Countdown GIF</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      padding: 16px;
    }
    #previewWrapper {
      border: 1px solid #444;
      display: inline-block;
      padding: 8px;
      background: #000;
      margin-top: 12px;
    }
    #preview {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 384px;
      height: 128px;
      border: 1px solid #555;
    }
    button {
      padding: 8px 14px;
      margin-top: 10px;
      margin-right: 8px;
      cursor: pointer;
    }
    .status {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
</head>
<body>

<h2>Penn T – Shovel in the Ground Countdown GIF</h2>
<p>Target date: <strong>December 31, 2027</strong></p>

<p id="label"></p>

<div id="previewWrapper">
  <canvas id="preview" width="96" height="32"></canvas>
</div>

<button id="generateScrollBtn">Generate Scrolling GIF</button>
<button id="generateScrollDaysBtn">Generate Scrolling GIF (with days)</button>
<button id="generateStaticBtn">Generate Static GIF</button>
<button id="generateStaticDaysBtn">Generate Static GIF (with days)</button>

<div class="status" id="status">Ready.</div>

<script>
// ===== CONSTANTS =====
const WIDTH = 96;
const HEIGHT = 32;
const COLOR = "#00ff00";

// Static/preview header (no ellipsis)
const TOP_TEXT = "Shovel in the Ground";

// UPDATED DEADLINE:
const TARGET = new Date("2027-12-31T00:00:00-05:00");

const LEFT_X = 1;

// ===== DATE MATH =====
function computeYMW() {
  const now = new Date();
  if (now >= TARGET) return { years: 0, months: 0, weeks: 0 };

  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const end   = new Date(TARGET.getFullYear(), TARGET.getMonth(), TARGET.getDate());

  let years  = end.getFullYear() - start.getFullYear();
  let months = end.getMonth() - start.getMonth();
  let days   = end.getDate() - start.getDate();

  if (days < 0) {
    months--;
    const prev = new Date(end.getFullYear(), end.getMonth(), 0).getDate();
    days += prev;
  }

  if (months < 0) {
    years--;
    months += 12;
  }

  const weeks = Math.floor(days / 7);
  return { years, months, weeks };
}

// Years/months/weeks + remaining days after weeks
function computeYMWD() {
  const now = new Date();
  if (now >= TARGET) return { years: 0, months: 0, weeks: 0, days: 0 };

  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const end   = new Date(TARGET.getFullYear(), TARGET.getMonth(), TARGET.getDate());

  let years  = end.getFullYear() - start.getFullYear();
  let months = end.getMonth() - start.getMonth();
  let days   = end.getDate() - start.getDate();

  if (days < 0) {
    months--;
    const prev = new Date(end.getFullYear(), end.getMonth(), 0).getDate();
    days += prev;
  }

  if (months < 0) {
    years--;
    months += 12;
  }

  const weeks = Math.floor(days / 7);
  const remDays = days - weeks * 7;

  return { years, months, weeks, days: remDays };
}

// Static (no days): 3 lines
function computeThreeLineStatic() {
  const { years, months, weeks } = computeYMW();
  return {
    line1: `${years} year${years === 1 ? "" : "s"}, ${months} month${months === 1 ? "" : "s"},`,
    line2: `${weeks} week${weeks === 1 ? "" : "s"}`
  };
}

// Static (with days): 3 lines but combine weeks+days on bottom
function computeThreeLineStaticWithDays() {
  const { years, months, weeks, days } = computeYMWD();
  return {
    line1: `${years} year${years === 1 ? "" : "s"}, ${months} month${months === 1 ? "" : "s"},`,
    line2: `${weeks} week${weeks === 1 ? "" : "s"}, ${days} day${days === 1 ? "" : "s"}`
  };
}

function todayStamp() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
}

// ===== FONT FITTING =====
function fitFont(ctx, text, maxWidth, sizes = [12, 11, 10, 9, 8]) {
  for (const s of sizes) {
    ctx.font = `${s}px Arial`;
    if (ctx.measureText(text).width <= maxWidth) {
      return `${s}px Arial`;
    }
  }
  return `8px Arial`;
}

// ===== PREVIEW =====
const preview = document.getElementById("preview");
const pctx = preview.getContext("2d");

function drawPreview() {
  // default preview: static without days
  const { line1, line2 } = computeThreeLineStatic();
  document.getElementById("label").innerText =
    `Label for today: "${line1} | ${line2}"`;

  pctx.fillStyle = "#000";
  pctx.fillRect(0, 0, WIDTH, HEIGHT);

  pctx.font = "10px Arial";
  pctx.fillStyle = COLOR;
  pctx.fillText(TOP_TEXT, LEFT_X, 10);

  pctx.font = "9px Arial";
  pctx.fillText(line1, LEFT_X, 20);
  pctx.fillText(line2, LEFT_X, 30);
}

drawPreview();

// ===== GIF UTILITY =====
function makeGif(name, frameCallback, done) {
  const gif = new GIF({
    workers: 2,
    quality: 10,
    width: WIDTH,
    height: HEIGHT,
    workerScript: "gif.worker.js"
  });

  frameCallback(gif);

  gif.on("finished", blob => {
    const a = document.createElement("a");
    const url = URL.createObjectURL(blob);
    a.href = url;
    a.download = name;
    a.click();
    URL.revokeObjectURL(url);
    done(name);
  });

  gif.render();
}

// ===== SCROLLING GIF (Y/M/W) =====
document.getElementById("generateScrollBtn").onclick = () => {
  const status = document.getElementById("status");
  status.textContent = "Generating scrolling GIF…";

  const full = computeYMW();
  const scrollText =
    `${full.years} years, ${full.months} months, ${full.weeks} weeks`;

  makeGif(
    `penn_scroll_${todayStamp()}.gif`,
    gif => {
      const c = document.createElement("canvas");
      c.width = WIDTH;
      c.height = HEIGHT;
      const ctx = c.getContext("2d");

      const SCROLL_HEADER = "Shovel in the Ground...";
      ctx.font = "12px Arial";
      const w = ctx.measureText(scrollText).width;

      for (let x = WIDTH; x > -w; x -= 2) {
        ctx.fillStyle = "#000";
        ctx.fillRect(0,0,WIDTH,HEIGHT);

        ctx.font = "10px Arial";
        ctx.fillStyle = COLOR;
        ctx.fillText(SCROLL_HEADER, LEFT_X, 10);

        ctx.font = "12px Arial";
        ctx.fillText(scrollText, x, 27);

        gif.addFrame(ctx, { copy: true, delay: 80 });
      }
    },
    name => status.textContent = `Done. Downloaded ${name}.`
  );
};

// ===== SCROLLING GIF (Y/M/W + DAYS) =====
document.getElementById("generateScrollDaysBtn").onclick = () => {
  const status = document.getElementById("status");
  status.textContent = "Generating scrolling GIF (with days)…";

  const full = computeYMWD();
  const scrollText =
    `${full.years} years, ${full.months} months, ${full.weeks} weeks, ${full.days} days`;

  makeGif(
    `penn_scroll_days_${todayStamp()}.gif`,
    gif => {
      const c = document.createElement("canvas");
      c.width = WIDTH;
      c.height = HEIGHT;
      const ctx = c.getContext("2d");

      const SCROLL_HEADER = "Shovel in the Ground...";
      ctx.font = "12px Arial";
      const w = ctx.measureText(scrollText).width;

      for (let x = WIDTH; x > -w; x -= 2) {
        ctx.fillStyle = "#000";
        ctx.fillRect(0,0,WIDTH,HEIGHT);

        ctx.font = "10px Arial";
        ctx.fillStyle = COLOR;
        ctx.fillText(SCROLL_HEADER, LEFT_X, 10);

        ctx.font = "12px Arial";
        ctx.fillText(scrollText, x, 27);

        gif.addFrame(ctx, { copy: true, delay: 80 });
      }
    },
    name => status.textContent = `Done. Downloaded ${name}.`
  );
};

// ===== STATIC 3-LINE GIF (no days) =====
document.getElementById("generateStaticBtn").onclick = () => {
  const status = document.getElementById("status");
  status.textContent = "Generating static GIF…";

  const { line1, line2 } = computeThreeLineStatic();

  makeGif(
    `penn_static_${todayStamp()}.gif`,
    gif => {
      const c = document.createElement("canvas");
      c.width = WIDTH;
      c.height = HEIGHT;
      const ctx = c.getContext("2d");

      ctx.fillStyle = "#000";
      ctx.fillRect(0,0,WIDTH,HEIGHT);

      ctx.font = fitFont(ctx, TOP_TEXT, WIDTH - 2, [10, 9, 8]);
      ctx.fillStyle = COLOR;
      ctx.fillText(TOP_TEXT, LEFT_X, 9);

      ctx.font = fitFont(ctx, line1, WIDTH - 2, [9, 8]);
      ctx.fillText(line1, LEFT_X, 20);

      ctx.font = fitFont(ctx, line2, WIDTH - 2, [9, 8]);
      ctx.fillText(line2, LEFT_X, 30);

      gif.addFrame(ctx, { copy: true, delay: 1500 });
    },
    name => status.textContent = `Done. Downloaded ${name}.`
  );
};

// ===== NEW: STATIC 3-LINE GIF (with days) =====
document.getElementById("generateStaticDaysBtn").onclick = () => {
  const status = document.getElementById("status");
  status.textContent = "Generating static GIF (with days)…";

  const { line1, line2 } = computeThreeLineStaticWithDays();

  makeGif(
    `penn_static_days_${todayStamp()}.gif`,
    gif => {
      const c = document.createElement("canvas");
      c.width = WIDTH;
      c.height = HEIGHT;
      const ctx = c.getContext("2d");

      ctx.fillStyle = "#000";
      ctx.fillRect(0,0,WIDTH,HEIGHT);

      ctx.font = fitFont(ctx, TOP_TEXT, WIDTH - 2, [10, 9, 8]);
      ctx.fillStyle = COLOR;
      ctx.fillText(TOP_TEXT, LEFT_X, 9);

      ctx.font = fitFont(ctx, line1, WIDTH - 2, [9, 8]);
      ctx.fillText(line1, LEFT_X, 20);

      // bottom line contains "X weeks, Y days"
      ctx.font = fitFont(ctx, line2, WIDTH - 2, [9, 8]);
      ctx.fillText(line2, LEFT_X, 30);

      gif.addFrame(ctx, { copy: true, delay: 1500 });
    },
    name => status.textContent = `Done. Downloaded ${name}.`
  );
};
</script>

</body>
</html>
