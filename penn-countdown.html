<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Penn T – Shovel in the Ground Countdown</title>

<style>
  body {
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
    padding: 20px;
  }
  button {
    margin: 6px 6px 6px 0;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  #preview {
    margin: 12px 0;
    border: 1px solid #444;
    padding: 6px;
    display: inline-block;
    background: #000;
  }
  canvas {
    image-rendering: pixelated;
  }
</style>
</head>

<body>

<h1>Penn T – Shovel in the Ground Countdown GIF</h1>
<p><b>Target date:</b> December 31, 2027</p>
<p id="label"></p>

<div id="preview">
  <canvas id="canvas" width="96" height="32"></canvas>
</div>

<br/>

<button onclick="makeScrolling(false)">Generate Scrolling GIF</button>
<button onclick="makeScrolling(true)">Generate Scrolling GIF (with days)</button><br/>
<button onclick="makeStatic(false)">Generate Static GIF</button>
<button onclick="makeStatic(true)">Generate Static GIF (with days)</button>

<p id="status">Ready.</p>

<script src="gif.js"></script>

<script>
/* ===============================
   CONSTANTS
================================ */
const WIDTH = 96;
const HEIGHT = 32;
const COLOR = "#00ff00";
const BG = "#000000";

/* ===============================
   TIMEZONE-SAFE DATE MATH
================================ */
function getNYParts(d = new Date()) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(d);

  const o = {};
  for (const p of parts) o[p.type] = p.value;
  return { y: +o.year, m: +o.month, d: +o.day };
}

function nyToUTC(y, m, d) {
  return Date.UTC(y, m - 1, d);
}

function computeYMWD() {
  const now = getNYParts();
  const target = { y: 2027, m: 12, d: 31 };

  let years = target.y - now.y;
  let months = target.m - now.m;
  let days = target.d - now.d;

  if (days < 0) {
    months--;
    days += new Date(Date.UTC(target.y, target.m - 1, 0)).getUTCDate();
  }
  if (months < 0) {
    years--;
    months += 12;
  }

  const weeks = Math.floor(days / 7);
  days -= weeks * 7;

  return { years, months, weeks, days };
}

function updateLabel() {
  const { years, months, weeks, days } = computeYMWD();
  document.getElementById("label").innerText =
    `Label for today: "${years} year, ${months} months | ${weeks} weeks${days ? ", " + days + " days" : ""}"`;
}
updateLabel();

/* ===============================
   DRAW HELPERS
================================ */
function clear(ctx) {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);
}

function drawText(ctx, text, x, y, size) {
  ctx.fillStyle = COLOR;
  ctx.font = `${size}px Arial`;
  ctx.textBaseline = "top";
  ctx.fillText(text, x, y);
}

/* ===============================
   STATIC GIF
================================ */
function makeStatic(withDays) {
  const { years, months, weeks, days } = computeYMWD();
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  clear(ctx);

  drawText(ctx, "Shovel in the Ground", 2, 1, 10);
  drawText(ctx, `${years} year, ${months} months,`, 2, 13, 9);

  const third = withDays
    ? `${weeks} weeks, ${days} days`
    : `${weeks} weeks`;

  drawText(ctx, third, 2, 23, 9);

  saveGIF([canvas], "static", withDays);
}

/* ===============================
   SCROLLING GIF
================================ */
function makeScrolling(withDays) {
  const { years, months, weeks, days } = computeYMWD();
  const bottom = withDays
    ? `${years} year, ${months} months, ${weeks} weeks, ${days} days`
    : `${years} year, ${months} months, ${weeks} weeks`;

  const frames = [];
  const tmp = document.createElement("canvas");
  tmp.width = WIDTH;
  tmp.height = HEIGHT;
  const tctx = tmp.getContext("2d");

  const textWidth = bottom.length * 6;
  for (let x = WIDTH; x > -textWidth; x -= 2) {
    clear(tctx);
    drawText(tctx, "Shovel in the Ground", 2, 1, 10);
    drawText(tctx, bottom, x, 16, 9);

    const frame = document.createElement("canvas");
    frame.width = WIDTH;
    frame.height = HEIGHT;
    frame.getContext("2d").drawImage(tmp, 0, 0);
    frames.push(frame);
  }

  saveGIF(frames, "scrolling", withDays);
}

/* ===============================
   GIF EXPORT
================================ */
function saveGIF(frames, mode, withDays) {
  const gif = new GIF({
    workers: 2,
    quality: 10,
    width: WIDTH,
    height: HEIGHT,
    workerScript: "gif.worker.js"
  });

  frames.forEach(c => gif.addFrame(c, { delay: 120 }));

  gif.on("finished", blob => {
    const today = new Date().toISOString().slice(0,10);
    const tag = withDays ? "with_days" : "no_days";
    const name = `penn_${mode}_${tag}_${today}.gif`;

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();

    document.getElementById("status").innerText =
      `Done. Saved ${name}`;
  });

  gif.render();
}
</script>

</body>
</html>
