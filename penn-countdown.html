<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Penn T Countdown GIF</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      padding: 16px;
    }
    #previewWrapper {
      border: 1px solid #444;
      display: inline-block;
      padding: 8px;
      background: #000;
      margin-top: 12px;
    }
    #preview {
      image-rendering: pixelated;
      border: 1px solid #555;
    }
    button {
      padding: 8px 14px;
      margin-top: 10px;
      cursor: pointer;
    }
    .status {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>

  <!-- gif.js from CDN (works fine over https) -->
  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
</head>
<body>
  <h2>Penn T – Shovel in the Ground Countdown GIF</h2>
  <p>Target date: <strong>December 1, 2027</strong></p>
  <p>This page calculates <code>X months, Y weeks</code> from today, shows a preview,
     and generates a <strong>96×32 green-on-black animated GIF</strong> for your LED sign.</p>

  <div id="label"></div>

  <div id="previewWrapper">
    <canvas id="preview" width="96" height="32"></canvas>
  </div>

  <div><button id="generateBtn">Generate GIF</button></div>

  <div class="status" id="status"></div>

<script>
const WIDTH = 96;
const HEIGHT = 32;
const TARGET = new Date("2027-12-01T00:00:00-05:00");
const canvas = document.getElementById('preview');
const ctx = canvas.getContext('2d');

const TOP_TEXT = "Shovel in the Ground...";
const COLOR = "#00ff00";
const BG = "#000000";

function computeMonthsWeeks() {
  const now = new Date();

  let months = (TARGET.getFullYear() - now.getFullYear()) * 12 +
               (TARGET.getMonth() - now.getMonth());

  let temp = new Date(now.getFullYear(), now.getMonth() + months, now.getDate());
  if (temp > TARGET) {
    months--;
    temp = new Date(now.getFullYear(), now.getMonth() + months, now.getDate());
  }

  const msDiff = TARGET - temp;
  const weeks = Math.max(0, Math.floor(msDiff / (7 * 24 * 60 * 60 * 1000)));

  return { months: Math.max(0, months), weeks };
}

function getLabel() {
  const { months, weeks } = computeMonthsWeeks();
  return `${months} months, ${weeks} weeks`;
}

function drawPreview() {
  const label = getLabel();
  document.getElementById('label').textContent =
    `Label for today: "${label}"`;

  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  ctx.fillStyle = COLOR;

  // top line
  ctx.font = "8px Arial";
  const topW = ctx.measureText(TOP_TEXT).width;
  const topX = Math.round((WIDTH - topW) / 2);
  const topY = 9;
  ctx.fillText(TOP_TEXT, topX, topY);

  // bottom line
  ctx.font = "10px Arial";
  const bottomW = ctx.measureText(label).width;
  const bottomX = Math.round((WIDTH - bottomW) / 2);
  const bottomY = HEIGHT - 4;
  ctx.fillText(label, bottomX, bottomY);
}

drawPreview();

document.getElementById('generateBtn').addEventListener('click', () => {
  const status = document.getElementById('status');
  status.textContent = "Generating GIF… please wait.";

  const label = getLabel();

  if (typeof GIF === "undefined") {
    status.textContent = "Error: gif.js did not load.";
    return;
  }

  const gif = new GIF({
    workers: 2,
    quality: 10,
    width: WIDTH,
    height: HEIGHT,
    workerScript: "https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js"
  });

  const tmp = document.createElement('canvas');
  tmp.width = WIDTH;
  tmp.height = HEIGHT;
  const tctx = tmp.getContext('2d');

  const topFont = "8px Arial";
  const bottomFont = "10px Arial";

  tctx.font = bottomFont;
  const bottomWidth = tctx.measureText(label).width;
  const startX = WIDTH;
  const endX = -bottomWidth;
  const step = 2;
  const bottomY = HEIGHT - 4;

  for (let x = startX; x > endX; x -= step) {
    tctx.fillStyle = BG;
    tctx.fillRect(0, 0, WIDTH, HEIGHT);

    tctx.fillStyle = COLOR;
    tctx.font = topFont;
    const topW = tctx.measureText(TOP_TEXT).width;
    const topX = Math.round((WIDTH - topW) / 2);
    const topY = 9;
    tctx.fillText(TOP_TEXT, topX, topY);

    tctx.font = bottomFont;
    tctx.fillText(label, x, bottomY);

    gif.addFrame(tmp, { copy: true, delay: 80 });
  }

  gif.on('finished', blob => {
    status.textContent = "GIF ready — downloading…";
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "penn_countdown.gif";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    status.textContent = "Done. Upload penn_countdown.gif to the LED app.";
  });

  gif.render();
});
</script>
</body>
</html>
