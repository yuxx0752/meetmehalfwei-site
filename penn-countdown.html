<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Penn T Countdown – JPG + WebM Export</title>
<style>
  body { background:#111; color:#eee; font-family:system-ui,sans-serif; padding:16px; }
  #panel { border:1px solid #444; padding:10px; background:#000; display:inline-block; }
  #canvas { width: 768px; height: 256px; image-rendering: pixelated; border:1px solid #555; }
  button { padding:8px 14px; margin:6px 6px 6px 0; cursor:pointer; }
  .muted { color:#bbb; font-size:13px; max-width: 820px; }
</style>
</head>
<body>

<h2>Penn T – Shovel in the Ground Countdown</h2>
<p><b>Target date:</b> December 31, 2027 (America/New_York calendar)</p>

<div id="panel">
  <canvas id="canvas" width="96" height="32"></canvas>
</div>

<div style="margin-top:10px;">
  <button id="btnStaticJpg">Download STATIC JPG</button>
  <button id="btnStaticJpgDays">Download STATIC JPG (with days)</button>
  <br/>
  <button id="btnScrollWebm">Download SCROLLING WebM</button>
  <button id="btnScrollWebmDays">Download SCROLLING WebM (with days)</button>
</div>

<p id="status" class="muted">Ready.</p>

<script>
/* =========================
   SETTINGS
========================= */
const W = 96, H = 32;
const COLOR = "#00ff00";
const BG = "#000000";

const TARGET_NY = { y: 2027, m: 12, d: 31 };

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const X = 1;
const Y_TOP = 1;
const Y_MID = 12;
const Y_BOT = 22;

function status(msg){ document.getElementById("status").textContent = msg; }

/* =========================
   TIMEZONE-SAFE NY DATE MATH
========================= */
function getNYParts(d = new Date()) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York",
    year: "numeric", month: "2-digit", day: "2-digit"
  }).formatToParts(d);

  const o = {};
  for (const p of parts) o[p.type] = p.value;
  return { y:+o.year, m:+o.month, d:+o.day };
}

function computeYMWD() {
  const now = getNYParts();

  let years  = TARGET_NY.y - now.y;
  let months = TARGET_NY.m - now.m;
  let days   = TARGET_NY.d - now.d;

  if (days < 0) {
    months--;
    const prevMonthDays = new Date(Date.UTC(TARGET_NY.y, TARGET_NY.m - 1, 0)).getUTCDate();
    days += prevMonthDays;
  }
  if (months < 0) {
    years--;
    months += 12;
  }

  const weeks = Math.floor(days / 7);
  days -= weeks * 7;

  if (years < 0) return { years:0, months:0, weeks:0, days:0 };
  return { years, months, weeks, days };
}

function stamp() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
}

/* =========================
   DRAW HELPERS (CRISP)
   (no XY offset “micro-bold”)
========================= */
function clear() {
  ctx.fillStyle = BG;
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = COLOR;
  ctx.textBaseline = "top";
}

function fitFont(text, maxWidth, sizes) {
  for (const s of sizes) {
    ctx.font = `${s}px Arial`;
    if (ctx.measureText(text).width <= maxWidth) return s;
  }
  return sizes[sizes.length-1];
}

function drawText(text, x, y, size) {
  ctx.font = `${size}px Arial`;
  // integer coordinates only => crisp
  ctx.fillText(text, x|0, y|0);
}

function drawStatic(withDays) {
  const { years, months, weeks, days } = computeYMWD();

  const top = "Shovel in the Ground";
  const line2 = `${years} year, ${months} months,`;
  const line3 = withDays ? `${weeks} weeks, ${days} days` : `${weeks} weeks`;

  clear();

  const topSize = fitFont(top, W-2, [10,9,8]);
  drawText(top, X, Y_TOP, topSize);

  const midSize = fitFont(line2, W-2, [9,8]);
  drawText(line2, X, Y_MID, midSize);

  const botSize = fitFont(line3, W-2, [9,8]);
  drawText(line3, X, Y_BOT, botSize);
}

function drawScrollingFrame(withDays, scrollX) {
  const { years, months, weeks, days } = computeYMWD();

  const top = "Shovel in the Ground";
  const bottom = withDays
    ? `${years} year, ${months} months, ${weeks} weeks, ${days} days`
    : `${years} year, ${months} months, ${weeks} weeks`;

  clear();

  const topSize = fitFont(top, W-2, [10,9,8]);
  drawText(top, X, Y_TOP, topSize);

  // Keep bottom at fixed size for consistency
  ctx.font = `9px Arial`;
  ctx.fillText(bottom, scrollX|0, 16);
}

/* =========================
   DOWNLOAD: JPG
========================= */
async function downloadJpg(withDays) {
  drawStatic(withDays);

  // JPG is fine; if you ever want maximum crispness, switch to PNG.
  const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.95));
  const name = `penn_static_${withDays ? "with_days_" : ""}${stamp()}.jpg`;

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  status(`Saved ${name}`);
}

/* =========================
   DOWNLOAD: SMOOTH WEBM SCROLL
   Key changes:
   - fps = 30 (was 10)
   - step = 1 px/frame (was 2)
   - duration computed from text width
   - requestAnimationFrame pacing
========================= */
async function downloadWebm(withDays) {
  status("Recording smooth scrolling WebM…");

  const { years, months, weeks, days } = computeYMWD();
  const bottom = withDays
    ? `${years} year, ${months} months, ${weeks} weeks, ${days} days`
    : `${years} year, ${months} months, ${weeks} weeks`;

  // Measure text width accurately
  ctx.font = "9px Arial";
  const textW = Math.ceil(ctx.measureText(bottom).width);

  const fps = 30;
  const stepPx = 1;  // smoother
  const startX = W;
  const endX = -textW;

  const totalFrames = Math.max(1, Math.ceil((startX - endX) / stepPx));
  const frameMs = 1000 / fps;
  const durationMs = Math.ceil(totalFrames * frameMs);

  const stream = canvas.captureStream(fps);
  let mime = "video/webm;codecs=vp9";
  if (!MediaRecorder.isTypeSupported(mime)) mime = "video/webm;codecs=vp8";
  if (!MediaRecorder.isTypeSupported(mime)) mime = "video/webm";

  const rec = new MediaRecorder(stream, { mimeType: mime });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };

  let x = startX;
  let frame = 0;
  let last = performance.now();

  rec.start();

  await new Promise(resolve => {
    function loop(t) {
      const elapsed = t - last;
      if (elapsed >= frameMs - 1) {
        last = t;

        drawScrollingFrame(withDays, x);
        x -= stepPx;
        frame++;

        if (frame >= totalFrames) {
          // Hold last frame a beat for readability
          drawScrollingFrame(withDays, endX);
          setTimeout(resolve, 150);
          return;
        }
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  });

  rec.stop();
  await new Promise(res => rec.onstop = res);

  const blob = new Blob(chunks, { type: mime });
  const name = `penn_scrolling_${withDays ? "with_days_" : ""}${stamp()}.webm`;

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  status(`Saved ${name} (30fps smooth scroll)`);
}

/* =========================
   Buttons + initial preview
========================= */
document.getElementById("btnStaticJpg").addEventListener("click", () => downloadJpg(false));
document.getElementById("btnStaticJpgDays").addEventListener("click", () => downloadJpg(true));
document.getElementById("btnScrollWebm").addEventListener("click", () => downloadWebm(false));
document.getElementById("btnScrollWebmDays").addEventListener("click", () => downloadWebm(true));

drawStatic(false);
</script>
</body>
</html>
