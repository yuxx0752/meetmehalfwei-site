<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Penn T Countdown GIF</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      padding: 16px;
    }
    #previewWrapper {
      border: 1px solid #444;
      display: inline-block;
      padding: 8px;
      background: #000;
      margin-top: 12px;
    }
    #preview {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 384px;
      height: 128px;
      border: 1px solid #555;
    }
    button {
      padding: 8px 14px;
      margin-top: 10px;
      margin-right: 8px;
      cursor: pointer;
    }
    .status {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
</head>
<body>

<h2>Penn T – Shovel in the Ground Countdown GIF</h2>
<p>Target date: <strong>December 1, 2027</strong></p>

<p id="label"></p>

<div id="previewWrapper">
  <canvas id="preview" width="96" height="32"></canvas>
</div>

<button id="generateScrollBtn">Generate Scrolling GIF</button>
<button id="generateStaticBtn">Generate Static GIF</button>

<div class="status" id="status">Ready.</div>

<script>
const WIDTH = 96;
const HEIGHT = 32;
const TARGET = new Date("2027-12-01T00:00:00-05:00");
const COLOR = "#00ff00";
const TOP_TEXT = "Shovel in the Ground...";

// ---- Compute years, months, weeks ----
function computeYMW() {
  const now = new Date();
  if (now >= TARGET) return { years: 0, months: 0, weeks: 0 };

  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const end   = new Date(TARGET.getFullYear(), TARGET.getMonth(), TARGET.getDate());

  let years  = end.getFullYear() - start.getFullYear();
  let months = end.getMonth() - start.getMonth();
  let days   = end.getDate() - start.getDate();

  if (days < 0) {
    months--;
    const prevMonthDays = new Date(end.getFullYear(), end.getMonth(), 0).getDate();
    days += prevMonthDays;
  }

  if (months < 0) {
    years--;
    months += 12;
  }

  const weeks = Math.floor(days / 7);

  return { years, months, weeks };
}

// ---- Full text for scrolling version ----
function computeYMWText() {
  const { years, months, weeks } = computeYMW();
  return `${years} year${years === 1 ? "" : "s"}, ${months} month${months === 1 ? "" : "s"}, ${weeks} week${weeks === 1 ? "" : "s"}`;
}

// ---- Smart shortening for static mode ----
function computeStaticShortText(ctx, fontBottom) {
  const { years, months, weeks } = computeYMW();

  const full = computeYMWText();       // "2 years, 7 months, 3 weeks"
  const med  = `${years}y ${months}m ${weeks}w`;
  const mid2 = `${years}y ${months}m`;
  const small = `${years*12 + months}m`;

  const options = [full, med, mid2, small];

  ctx.font = fontBottom;

  for (const opt of options) {
    if (ctx.measureText(opt).width <= WIDTH - 2) {
      return opt;
    }
  }

  return small; // fallback
}

// ---- Preview drawing ----
const canvas = document.getElementById("preview");
const ctx = canvas.getContext("2d");

function drawPreview() {
  const fullText = computeYMWText();
  document.getElementById("label").innerText = `Label for today: "${fullText}"`;

  const fontTop = "9px Arial";
  const fontBottom = "12px Arial";

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  ctx.fillStyle = COLOR;

  ctx.font = fontTop;
  const topW = ctx.measureText(TOP_TEXT).width;
  ctx.fillText(TOP_TEXT, (WIDTH - topW) / 2, 11);

  ctx.font = fontBottom;
  const bottomW = ctx.measureText(fullText).width;
  ctx.fillText(fullText, (WIDTH - bottomW) / 2, 24);
}

drawPreview();

// ---- Today's date for filenames ----
function todayStamp() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
}

// ---- Shared GIF builder ----
function makeGif(filename, addFrames, done) {
  const gif = new GIF({
    workers: 2,
    quality: 10,
    width: WIDTH,
    height: HEIGHT,
    workerScript: "gif.worker.js"
  });

  addFrames(gif);

  gif.on("finished", blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
    done(filename);
  });

  gif.render();
}

// ---- Scrolling GIF ----
document.getElementById("generateScrollBtn").onclick = () => {
  const status = document.getElementById("status");
  status.textContent = "Generating scrolling GIF…";

  const text = computeYMWText();

  makeGif(
    `penn_countdown_scroll_${todayStamp()}.gif`,
    gif => {
      const temp = document.createElement("canvas");
      temp.width = WIDTH;
      temp.height = HEIGHT;
      const t = temp.getContext("2d");

      const fontTop = "9px Arial";
      const fontBottom = "12px Arial";

      t.font = fontBottom;
      const textWidth = t.measureText(text).width;
      const start = WIDTH;
      const end = -textWidth;

      for (let x = start; x > end; x -= 2) {
        t.fillStyle = "#000";
        t.fillRect(0, 0, WIDTH, HEIGHT);

        // top
        t.font = fontTop;
        const topW = t.measureText(TOP_TEXT).width;
        t.fillStyle = COLOR;
        t.fillText(TOP_TEXT, (WIDTH - topW) / 2, 11);

        // bottom scroll
        t.font = fontBottom;
        t.fillText(text, x, 24);

        gif.addFrame(t, { copy: true, delay: 80 });
      }
    },
    name => status.textContent = `Done. Downloaded ${name}.`
  );
};

// ---- Static GIF ----
document.getElementById("generateStaticBtn").onclick = () => {
  const status = document.getElementById("status");
  status.textContent = "Generating static GIF…";

  makeGif(
    `penn_countdown_static_${todayStamp()}.gif`,
    gif => {
      const temp = document.createElement("canvas");
      temp.width = WIDTH;
      temp.height = HEIGHT;
      const t = temp.getContext("2d");

      const fontTop = "9px Arial";
      const fontBottom = "12px Arial";

      // Choose shortened text that fits
      const shortText = computeStaticShortText(t, fontBottom);

      t.fillStyle = "#000";
      t.fillRect(0, 0, WIDTH, HEIGHT);

      // top
      t.font = fontTop;
      t.fillStyle = COLOR;
      const topW = t.measureText(TOP_TEXT).width;
      t.fillText(TOP_TEXT, (WIDTH - topW) / 2, 11);

      // bottom (centered static)
      t.font = fontBottom;
      const bw = t.measureText(shortText).width;
      t.fillText(shortText, (WIDTH - bw) / 2, 24);

      gif.addFrame(t, { copy: true, delay: 1500 });
    },
    name => status.textContent = `Done. Downloaded ${name}.`
  );
};
</script>

</body>
</html>
