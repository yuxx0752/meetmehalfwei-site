<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Penn T Countdown GIF</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      padding: 16px;
    }
    #previewWrapper {
      border: 1px solid #444;
      display: inline-block;
      padding: 8px;
      background: #000;
      margin-top: 12px;
    }
    #preview {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 384px;
      height: 128px;
      border: 1px solid #555;
    }
    button {
      padding: 8px 14px;
      margin-top: 10px;
      margin-right: 8px;
      cursor: pointer;
    }
    .status {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
</head>
<body>

<h2>Penn T – Shovel in the Ground Countdown GIF</h2>
<p>Target date: <strong>December 31, 2027</strong></p>

<p id="label"></p>

<div id="previewWrapper">
  <canvas id="preview" width="96" height="32"></canvas>
</div>

<button id="generateScrollBtn">Generate Scrolling GIF</button>
<button id="generateScrollDaysBtn">Generate Scrolling GIF (with days)</button>
<button id="generateStaticBtn">Generate Static GIF</button>
<button id="generateStaticDaysBtn">Generate Static GIF (with days)</button>

<div class="status" id="status">Ready.</div>

<script>
// ===== CONSTANTS =====
const WIDTH = 96;
const HEIGHT = 32;
const COLOR = "#00ff00";
const TOP_TEXT = "Shovel in the Ground";
const TARGET = new Date("2027-12-31T00:00:00-05:00");
const LEFT_X = 1;
const STATIC_FRAMES = 60;
const STATIC_DELAY = 100; // ms per frame (~6s total)

// ===== DATE MATH =====
function computeYMW() {
  const now = new Date();
  if (now >= TARGET) return { years: 0, months: 0, weeks: 0 };

  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const end   = new Date(TARGET.getFullYear(), TARGET.getMonth(), TARGET.getDate());

  let years  = end.getFullYear() - start.getFullYear();
  let months = end.getMonth() - start.getMonth();
  let days   = end.getDate() - start.getDate();

  if (days < 0) {
    months--;
    days += new Date(end.getFullYear(), end.getMonth(), 0).getDate();
  }

  if (months < 0) {
    years--;
    months += 12;
  }

  return { years, months, weeks: Math.floor(days / 7) };
}

function computeYMWD() {
  const { years, months, weeks } = computeYMW();
  const now = new Date();
  const daysTotal = Math.floor((TARGET - now) / (1000 * 60 * 60 * 24));
  return { years, months, weeks, days: daysTotal % 7 };
}

function computeStatic() {
  const { years, months, weeks } = computeYMW();
  return {
    line1: `${years} year${years===1?"":"s"}, ${months} month${months===1?"":"s"},`,
    line2: `${weeks} week${weeks===1?"":"s"}`
  };
}

function computeStaticDays() {
  const { years, months, weeks, days } = computeYMWD();
  return {
    line1: `${years} year${years===1?"":"s"}, ${months} month${months===1?"":"s"},`,
    line2: `${weeks} week${weeks===1?"":"s"}, ${days} day${days===1?"":"s"}`
  };
}

function todayStamp() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function fitFont(ctx, text, maxWidth, sizes=[10,9,8]) {
  for (const s of sizes) {
    ctx.font = `${s}px Arial`;
    if (ctx.measureText(text).width <= maxWidth) return `${s}px Arial`;
  }
  return "8px Arial";
}

// ===== PREVIEW =====
const pctx = document.getElementById("preview").getContext("2d");
(function drawPreview(){
  const { line1, line2 } = computeStatic();
  document.getElementById("label").innerText =
    `Label for today: "${line1} | ${line2}"`;

  pctx.fillStyle="#000";
  pctx.fillRect(0,0,WIDTH,HEIGHT);
  pctx.fillStyle=COLOR;

  pctx.font="10px Arial";
  pctx.fillText(TOP_TEXT, LEFT_X, 10);
  pctx.font="9px Arial";
  pctx.fillText(line1, LEFT_X, 20);
  pctx.fillText(line2, LEFT_X, 30);
})();

// ===== GIF HELPER =====
function makeGif(name, drawFn) {
  const gif = new GIF({
    workers: 2,
    quality: 10,
    width: WIDTH,
    height: HEIGHT,
    workerScript: "gif.worker.js"
  });

  drawFn(gif);

  gif.on("finished", blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
    document.getElementById("status").textContent =
      `Done. Downloaded ${name}.`;
  });

  gif.render();
}

// ===== STATIC (NO DAYS) — 60 FRAMES =====
document.getElementById("generateStaticBtn").onclick = () => {
  document.getElementById("status").textContent = "Generating static GIF…";
  const { line1, line2 } = computeStatic();

  makeGif(`penn_static_${todayStamp()}.gif`, gif => {
    const c=document.createElement("canvas");
    c.width=WIDTH; c.height=HEIGHT;
    const ctx=c.getContext("2d");

    for(let i=0;i<STATIC_FRAMES;i++){
      ctx.fillStyle="#000";
      ctx.fillRect(0,0,WIDTH,HEIGHT);
      ctx.fillStyle=COLOR;

      ctx.font=fitFont(ctx,TOP_TEXT,WIDTH-2);
      ctx.fillText(TOP_TEXT,LEFT_X,9);

      ctx.font=fitFont(ctx,line1,WIDTH-2,[9,8]);
      ctx.fillText(line1,LEFT_X,20);

      ctx.font=fitFont(ctx,line2,WIDTH-2,[9,8]);
      ctx.fillText(line2,LEFT_X,30);

      gif.addFrame(ctx,{copy:true,delay:STATIC_DELAY});
    }
  });
};

// ===== STATIC (WITH DAYS) — 60 FRAMES =====
document.getElementById("generateStaticDaysBtn").onclick = () => {
  document.getElementById("status").textContent = "Generating static GIF (with days)…";
  const { line1, line2 } = computeStaticDays();

  makeGif(`penn_static_days_${todayStamp()}.gif`, gif => {
    const c=document.createElement("canvas");
    c.width=WIDTH; c.height=HEIGHT;
    const ctx=c.getContext("2d");

    for(let i=0;i<STATIC_FRAMES;i++){
      ctx.fillStyle="#000";
      ctx.fillRect(0,0,WIDTH,HEIGHT);
      ctx.fillStyle=COLOR;

      ctx.font=fitFont(ctx,TOP_TEXT,WIDTH-2);
      ctx.fillText(TOP_TEXT,LEFT_X,9);

      ctx.font=fitFont(ctx,line1,WIDTH-2,[9,8]);
      ctx.fillText(line1,LEFT_X,20);

      ctx.font=fitFont(ctx,line2,WIDTH-2,[9,8]);
      ctx.fillText(line2,LEFT_X,30);

      gif.addFrame(ctx,{copy:true,delay:STATIC_DELAY});
    }
  });
};
</script>

</body>
</html>
