<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Penn T Countdown GIF</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      padding: 16px;
    }
    #previewWrapper {
      border: 1px solid #444;
      display: inline-block;
      padding: 8px;
      background: #000;
      margin-top: 12px;
    }
    #preview {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 384px;
      height: 128px;
      border: 1px solid #555;
    }
    button {
      padding: 8px 14px;
      margin-top: 10px;
      cursor: pointer;
    }
    .status {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
</head>
<body>

<h2>Penn T – Shovel in the Ground Countdown GIF</h2>
<p>Target date: <strong>December 1, 2027</strong></p>

<p id="label"></p>

<div id="previewWrapper">
  <canvas id="preview" width="96" height="32"></canvas>
</div>

<button id="generateBtn">Generate GIF</button>

<div class="status" id="status">Ready.</div>

<script>
const WIDTH = 96;
const HEIGHT = 32;
const TARGET = new Date("2027-12-01T00:00:00-05:00");
const COLOR = "#00ff00";

// Text
const TOP_TEXT = "Shovel in the Ground...";

// Compute months + weeks
function computeMW() {
  const now = new Date();
  let months = (TARGET.getFullYear() - now.getFullYear()) * 12 +
               (TARGET.getMonth() - now.getMonth());

  const test = new Date(now.getFullYear(), now.getMonth() + months, now.getDate());
  if (test > TARGET) months--;

  const temp = new Date(now.getFullYear(), now.getMonth() + months, now.getDate());
  const diff = TARGET - temp;
  const weeks = Math.floor(diff / (7 * 24 * 60 * 60 * 1000));
  return `${months} months, ${weeks} weeks`;
}

const canvas = document.getElementById("preview");
const ctx = canvas.getContext("2d");

function drawPreview() {
  const label = computeMW();
  document.getElementById("label").innerText = `Label for today: "${label}"`;

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  ctx.fillStyle = COLOR;

  // TOP LINE — 9px, baseline at y=11
  const fontTop = "9px Arial";
  ctx.font = fontTop;
  const topW = ctx.measureText(TOP_TEXT).width;
  const topX = (WIDTH - topW) / 2;
  const topY = 11;
  ctx.fillText(TOP_TEXT, topX, topY);

  // BOTTOM LINE — 12px, baseline at y=24 (closer gap)
  const fontBottom = "12px Arial";
  ctx.font = fontBottom;
  const bottomW = ctx.measureText(label).width;
  const bottomX = (WIDTH - bottomW) / 2;
  const bottomY = 24;
  ctx.fillText(label, bottomX, bottomY);
}

drawPreview();

document.getElementById("generateBtn").onclick = () => {
  const status = document.getElementById("status");
  status.textContent = "Generating GIF…";

  const label = computeMW();
  const gif = new GIF({
    workers: 2,
    quality: 10,
    width: WIDTH,
    height: HEIGHT,
    workerScript: "gif.worker.js"   // local worker on meetmehalfwei.art
  });

  const tempCanvas = document.createElement("canvas");
  tempCanvas.width = WIDTH;
  tempCanvas.height = HEIGHT;
  const tctx = tempCanvas.getContext("2d");

  const fontTop = "9px Arial";
  const fontBottom = "12px Arial";

  // measure bottom text width for scrolling
  tctx.font = fontBottom;
  const textWidth = tctx.measureText(label).width;
  const startX = WIDTH;
  const endX = -textWidth;
  const step = 2;
  const bottomY = 24;   // match preview

  for (let x = startX; x > endX; x -= step) {
    tctx.fillStyle = "#000";
    tctx.fillRect(0, 0, WIDTH, HEIGHT);

    // TOP
    tctx.font = fontTop;
    tctx.fillStyle = COLOR;
    const topW = tctx.measureText(TOP_TEXT).width;
    const topX = (WIDTH - topW) / 2;
    const topY = 11;
    tctx.fillText(TOP_TEXT, topX, topY);

    // SCROLLING BOTTOM
    tctx.font = fontBottom;
    tctx.fillText(label, x, bottomY);

    gif.addFrame(tctx, { copy: true, delay: 80 });
  }

  gif.on("finished", blob => {
    // filename with today's date: penn_countdown_YYYY-MM-DD.gif
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    const filename = `penn_countdown_${y}-${m}-${d}.gif`;

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    status.textContent = `Done. GIF downloaded as ${filename}.`;
  });

  gif.render();
};
</script>
</body>
</html>
