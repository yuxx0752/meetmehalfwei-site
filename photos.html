<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos — Wei Yu</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px;
    position: relative;
  }

  /* Background consistent with home */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.55), rgba(230,230,235,0) 60%),
      radial-gradient(circle at 80% 25%, rgba(215,220,230,0.45), rgba(230,230,235,0) 65%),
      radial-gradient(circle at 30% 75%, rgba(200,205,215,0.45), rgba(230,230,235,0) 65%),
      radial-gradient(circle at 70% 70%, rgba(235,240,255,0.35), rgba(230,230,235,0) 60%),
      linear-gradient(180deg, #e3e5e9 0%, #dcdfe4 100%);
  }

  .bg-layer::before {
    content: "";
    position: absolute;
    inset: -40px;
    pointer-events: none;
    background-image: 
      url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIW2NkYPhfDwAB5gGkz7LxyzAAAAAASUVORK5CYII=');
    opacity: 0.22;
    mix-blend-mode: soft-light;
  }

  .container {
    width: 100%;
    max-width: 900px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 32px;
  }

  h1 {
    font-size: 32px;
    letter-spacing: 0.08em;
  }

  .back-link {
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    color: #111;
  }

  .back-link:hover {
    opacity: 0.6;
  }

  /* Big stacked photo */
  .photo-block {
    margin-bottom: 40px;
  }

  .photo-block img {
    width: 100%;
    border-radius: 18px;
    object-fit: cover;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  .item-title {
    margin-top: 14px;
    font-size: 20px;
    font-weight: 600;
  }

  .item-subtitle {
    font-size: 14px;
    color: #555;
    margin-top: 4px;
  }

  @media (max-width: 600px) {
    h1 { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="bg-layer"></div>

<div class="container">

  <header>
    <h1>Photos</h1>
    <a href="index.html" class="back-link">← Back to Home</a>
  </header>

  <div class="photo-block">
    <img src="img/MIAMI1.jpg" alt="Miami">
    <div class="item-title">Miami</div>
    <div class="item-subtitle">A Brightline Train!</div>
  </div>

  <div class="photo-block">
    <img src="img/NYC1.jpg" alt="New York City">
    <div class="item-title">New York City</div>
    <div class="item-subtitle">A Electric Street Sweeper!</div>
  </div>

  <div class="photo-block">
    <img src="img/NZ1.jpg" alt="New Zealand">
    <div class="item-title">New Zealand</div>
    <div class="item-subtitle">A Beach!</div>
  </div>

  <div class="photo-block">
    <img src="img/UK1.jpg" alt="United Kingdom">
    <div class="item-title">UK</div>
    <div class="item-subtitle">A Castle!</div>
  </div>

</div>

</body>
</html>
