<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos — Wei Yu</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px;
    position: relative;
  }

  /* same background style as home */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;

    background:
      radial-gradient(circle at 20% 30%, rgba(226,235,209,0.55), rgba(230,230,235,0) 60%),
      radial-gradient(circle at 80% 25%, rgba(216,240,224,0.45), rgba(230,230,235,0) 65%),
      radial-gradient(circle at 30% 75%, rgba(233,235,197,0.45), rgba(230,230,235,0) 65%),
      radial-gradient(circle at 70% 70%, rgba(235,240,255,0.35), rgba(230,230,235,0) 60%),
      linear-gradient(180deg, #e3e5e9 0%, #dcdfe4 100%);
  }

  .bg-layer::before {
    content: "";
    position: absolute;
    inset: -40px;
    pointer-events: none;
    background-image: 
      url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIW2NkYPhfDwAB5gGkz7LxyzAAAAAASUVORK5CYII=');
    opacity: 0.22;
    mix-blend-mode: soft-light;
  }

  .container {
    width: 100%;
    max-width: 980px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 32px;
  }

  h1 {
    font-size: 32px;
    letter-spacing: 0.08em;
  }

  .back-link {
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    color: #111;
  }

  .back-link:hover {
    opacity: 0.6;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }

  .item img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    border-radius: 12px;
    display: block;
  }

  .item-title {
    margin-top: 10px;
    font-size: 16px;
    font-weight: 600;
  }

  .item-subtitle {
    font-size: 13px;
    color: #555;
    margin-top: 2px;
  }

  @media (max-width: 600px) {
    body {
      padding-top: 32px;
    }

    h1 {
      font-size: 26px;
    }
  }
</style>
</head>
<body>

<div class="bg-layer"></div>

<div class="container">

  <header>
    <h1>Photos</h1>
    <a href="index.html" class="back-link">← Back to Home</a>
  </header>

  <section class="grid">
    <div class="item">
      <img src="img/MIAMI1.jpg" alt="Miami">
      <div class="item-title">Miami</div>
      <div class="item-subtitle">Got to check out a Brightline Train</div>
    </div>

    <div class="item">
      <img src="img/NYC1.jpg" alt="New York City">
      <div class="item-title">New York City</div>
      <div class="item-subtitle">Got to check out a electric street sweeper</div>
    </div>

    <div class="item">
      <img src="img/NZ1.jpg" alt="New Zealand">
      <div class="item-title">New Zealand</div>
      <div class="item-subtitle">Got to check out Auckland</div>
    </div>

    <div class="item">
      <img src="img/UK1.jpg" alt="United Kingdom">
      <div class="item-title">UK</div>
      <div class="item-subtitle">Got to check out a cool castle</div>
    </div>
  </section>

</div>

</body>
</html>
