<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grad School — Wei Yu</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px;
    position: relative;
  }

  /* same background as other pages */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.55), rgba(230,230,235,0) 60%),
      radial-gradient(circle at 80% 25%, rgba(215,220,230,0.45), rgba(230,230,235,0) 65%),
      radial-gradient(circle at 30% 75%, rgba(200,205,215,0.45), rgba(230,230,235,0) 65%),
      radial-gradient(circle at 70% 70%, rgba(235,240,255,0.35), rgba(230,230,235,0) 60%),
      linear-gradient(180deg, #e3e5e9 0%, #dcdfe4 100%);
  }

  .bg-layer::before {
    content: "";
    position: absolute;
    inset: -40px;
    pointer-events: none;
    background-image: 
      url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIW2NkYPhfDwAB5gGkz7LxyzAAAAAASUVORK5CYII=');
    opacity: 0.22;
    mix-blend-mode: soft-light;
  }

  .container {
    width: 100%;
    max-width: 900px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 32px;
  }

  h1 {
    font-size: 32px;
    letter-spacing: 0.08em;
  }

  .back-link {
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    color: #111;
  }

  .back-link:hover {
    opacity: 0.6;
  }

  /* big stacked grad pieces */
  .grad-block {
    margin-bottom: 40px;
  }

  .grad-block img {
    width: 100%;
    border-radius: 18px;
    object-fit: cover;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  .grad-title {
    margin-top: 12px;
    font-size: 18px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="bg-layer"></div>

<div class="container">

  <header>
    <h1>Grad School</h1>
    <a href="index.html" class="back-link">← Back to Home</a>
  </header>

  <div class="grad-block">
    <img src="img/g1.PNG" alt="Grad piece 1">
    <div class="grad-title">Grad 1</div>
  </div>

  <div class="grad-block">
    <img src="img/g2.jpg" alt="Grad piece 2">
    <div class="grad-title">Grad 2</div>
  </div>

  <div class="grad-block">
    <img src="img/g3.jpg" alt="Grad piece 3">
    <div class="grad-title">Grad 3</div>
  </div>

  <div class="grad-block">
    <img src="img/g4.png" alt="Grad piece 4">
    <div class="grad-title">Grad 4</div>
  </div>

  <div class="grad-block">
    <img src="img/g5.jpg" alt="Grad piece 5">
    <div class="grad-title">Grad 5</div>
  </div>

  <div class="grad-block">
    <img src="img/g6.png" alt="Grad piece 6">
    <div class="grad-title">Grad 6</div>
  </div>

  <div class="grad-block">
    <img src="img/g7.png" alt="Grad piece 7">
    <div class="grad-title">Grad 7</div>
  </div>

  <div class="grad-block">
    <img src="img/g8.png" alt="Grad piece 8">
    <div class="grad-title">Grad 8</div>
  </div>

  <div class="grad-block">
    <img src="img/g9.png" alt="Grad piece 9">
    <div class="grad-title">Grad 9</div>
  </div>

  <div class="grad-block">
    <img src="img/g10.png" alt="Grad piece 10">
    <div class="grad-title">Grad 10</div>
  </div>

</div>

</body>
</html>
