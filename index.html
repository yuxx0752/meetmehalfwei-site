<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wei Yu — Portfolio</title>

<style>
  /* RESET */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px;
    position: relative;
  }

  /* STATIC SOFT GREY BACKGROUND */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;

    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.55), rgba(230,230,235,0) 60%),
      radial-gradient(circle at 80% 25%, rgba(215,220,230,0.45), rgba(230,230,235,0) 65%),
      radial-gradient(circle at 30% 75%, rgba(200,205,215,0.45), rgba(230,230,235,0) 65%),
      radial-gradient(circle at 70% 70%, rgba(235,240,255,0.35), rgba(230,230,235,0) 60%),
      linear-gradient(180deg, #e3e5e9 0%, #dcdfe4 100%);
  }

  /* Grain overlay */
  .bg-layer::before {
    content: "";
    position: absolute;
    inset: -40px;
    pointer-events: none;

    background-image: 
      url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIW2NkYPhfDwAB5gGkz7LxyzAAAAAASUVORK5CYII=');
    opacity: 0.22;
    mix-blend-mode: soft-light;
  }

  /* LAYOUT */
  .container {
    max-width: 850px;
    width: 100%;
    text-align: left;
  }

  /* PHOTO */
  .portrait {
    width: 190px;
    height: 190px;
    border-radius: 12px;
    object-fit: cover;
    margin-bottom: 30px;
  }

  /* TEXT */
  h1 {
    font-size: 64px;
    font-weight: 800;
    margin-bottom: 20px;
  }

  .subtitle {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 40px;
    line-height: 1.4;
  }

  /* CATEGORY LINKS */
  .section-links a {
    display: block;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
    text-decoration: none;
    color: #111;
  }

  .section-links a:hover {
    opacity: 0.6;
  }

  /* SOCIAL BUTTONS */
  .socials {
    margin-top: 40px;
  }

  .socials a {
    display: inline-block;
    margin-right: 20px;
    font-size: 20px;
    font-weight: 600;
    text-decoration: none;
    color: #111;
  }

  .socials a:hover {
    opacity: 0.6;
  }
</style>
</head>
<body>

<div class="bg-layer"></div>

<div class="container">

  <!-- PORTRAIT -->
  <img src="img/WeiYuPortrait.jpg" alt="Wei Yu portrait" class="portrait">

  <!-- NAME -->
  <h1>WEI YU</h1>

  <!-- ONE-LINE TITLES -->
  <div class="subtitle">
    Urban Planner • Analyst • Artist • Designer
  </div>

  <!-- CATEGORIES -->
  <div class="section-links">
    <a href="#">WORK — AMTRAK</a>
    <a href="#">WORK — MASTERS OF URBAN PLANNING</a>
    <a href="#">ART</a>
    <a href="#">PHOTOS</a>
  </div>

  <!-- SOCIALS -->
  <div class="socials">
    <a href="https://www.linkedin.com/in/robert-wei-yu-650204137/" target="_blank">LinkedIn</a>
    <a href="mailto:yuxx0752@gmail.com">Email</a>
  </div>

</div>

</body>
</html>
