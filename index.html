<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wei Yu · Urban Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #dde1e8;       /* slightly richer grey */
      --text: #111827;     /* near-black */
      --muted: #4b5563;    /* secondary text */
      --accent: #111827;   /* for hover underline */
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      position: relative;
      overflow-x: hidden;
    }

    /* Animated blob + grain background */
    .bg-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
      background:
        radial-gradient(circle at 18% 25%, rgba(255, 255, 255, 0.7), transparent 55%),
        radial-gradient(circle at 82% 22%, rgba(255, 255, 255, 0.45), transparent 55%),
        radial-gradient(circle at 20% 82%, rgba(255, 255, 255, 0.5), transparent 55%),
        radial-gradient(circle at 86% 76%, rgba(255, 255, 255, 0.65), transparent 55%),
        var(--bg);
      background-size: 150% 150%;
      animation: gradientBlobs 22s ease-in-out infinite alternate;
    }

    .bg-layer::before {
      content: "";
      position: absolute;
      inset: -40px;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.4) 0, transparent 60%);
      mix-blend-mode: soft-light;
      opacity: 0.24;
      animation: grainShift 2.4s steps(4) infinite;
    }

    @keyframes gradientBlobs {
      0% {
        background-position: 0% 0%;
      }
      33% {
        background-position: 30% 80%;
      }
      66% {
        background-position: 80% 40%;
      }
      100% {
        background-position: 50% 50%;
      }
    }

    @keyframes grainShift {
      0%   { transform: translate3d(0, 0, 0); }
      25%  { transform: translate3d(-10px, 8px, 0); }
      50%  { transform: translate3d(6px, -10px, 0); }
      75%  { transform: translate3d(-4px, 4px, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: clamp(2.5rem, 5vw, 4rem);
    }

    .content {
      max-width: 720px;
    }

    .profile-photo {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 2rem;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
    }

    .name {
      font-size: clamp(3.8rem, 6vw, 5rem); /* bigger name */
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 1.3rem;
    }

    .tagline {
      font-size: 1rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin: 0 0 1.5rem;
    }

    .meta-lines {
      margin: 0 0 2.8rem;
      font-size: 0.96rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      line-height: 1.8;
    }

    .meta-lines strong {
      font-weight: 600;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      font-size: 1rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    a {
      color: inherit;
      text-decoration: none;
      position: relative;
      display: inline-block;
      padding-bottom: 2px;
    }

    a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 1px;
      background-color: var(--accent);
      transition: width 0.18s ease-out;
    }

    a:hover::after,
    a:focus-visible::after {
      width: 100%;
    }

    small {
      display: block;
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 640px) {
      .page {
        align-items: flex-start;
        padding-top: 4rem;
      }

      .meta-lines {
        margin-bottom: 2.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>

  <div class="page">
    <main class="content">
      <img src="img/WeiYuPortrait.jpg" alt="Portrait of Wei Yu" class="profile-photo" />

      <h1 class="name">Wei&nbsp;Yu</h1>

      <p class="tagline">
        Urban Planner &nbsp;·&nbsp; Analyst &nbsp;·&nbsp; Artist &nbsp;·&nbsp; Designer
      </p>

      <div class="meta-lines">
        <div><strong>Work – Amtrak</strong></div>
        <div><strong>Work – Masters of Urban Planning</strong></div>
        <div><strong>Art</strong></div>
        <div><strong>Photos</strong></div>
      </div>

      <nav class="links" aria-label="Primary contact links">
        <a href="https://www.linkedin.com/in/robert-wei-yu-650204137/" target="_blank" rel="noopener noreferrer">
          LinkedIn
        </a>
        <a href="mailto:yuxx0752@gmail.com">Email</a>
      </nav>

      <small>meetmehalfwei.art</small>
    </main>
  </div>
</body>
</html>
