<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wei Yu · Urban Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #e5e7eb;       /* base grey */
      --text: #111827;     /* near-black */
      --muted: #4b5563;    /* secondary text */
      --accent: #111827;   /* for hover underline */
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      position: relative;
      overflow-x: hidden;
    }

    /* Animated gradient + grain background layer */
    .bg-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
      background:
        radial-gradient(circle at 0% 0%, rgba(255, 255, 255, 0.7), transparent 55%),
        radial-gradient(circle at 100% 0%, rgba(255, 255, 255, 0.45), transparent 55%),
        radial-gradient(circle at 0% 100%, rgba(255, 255, 255, 0.4), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(255, 255, 255, 0.65), transparent 55%),
        var(--bg);
      background-size: 160% 160%;
      animation: gradientFlow 18s ease-in-out infinite alternate;
    }

    .bg-layer::before {
      content: "";
      position: absolute;
      inset: -40px;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.35) 0, transparent 60%);
      mix-blend-mode: soft-light;
      opacity: 0.23;
      animation: grainShift 2.4s steps(4) infinite;
    }

    @keyframes gradientFlow {
      0% {
        background-position: 0% 0%;
      }
      50% {
        background-position: 50% 100%;
      }
      100% {
        background-position: 100% 50%;
      }
    }

    @keyframes grainShift {
      0%   { transform: translate3d(0, 0, 0); }
      25%  { transform: translate3d(-10px, 8px, 0); }
      50%  { transform: translate3d(6px, -10px, 0); }
      75%  { transform: translate3d(-4px, 4px, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: clamp(2.5rem, 5vw, 4rem);
    }

    .content {
      max-width: 720px;
    }

    .name {
      font-size: clamp(2.4rem, 3.5vw, 3rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 1.6rem;
    }

    .roles {
      font-size: clamp(1.1rem, 1.5vw, 1.3rem);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      line-height: 1.7;
      margin: 0 0 3rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      font-size: 1rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    a {
      color: inherit;
      text-decoration: none;
      position: relative;
      display: inline-block;
      padding-bottom: 2px;
    }

    a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 1px;
      background-color: var(--accent);
      transition: width 0.18s ease-out;
    }

    a:hover::after,
    a:focus-visible::after {
      width: 100%;
    }

    small {
      display: block;
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 640px) {
      .page {
        align-items: flex-start;
        padding-top: 4rem;
      }

      .roles {
        margin-bottom: 2.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>

  <div class="page">
    <main class="content">
      <h1 class="name">Wei&nbsp;Yu</h1>

      <p class="roles">
        Urban Planner<br />
        Analyst<br />
        Artist<br />
        Designer
      </p>

      <nav class="links" aria-label="Primary contact links">
        <a href="https://www.linkedin.com/in/robert-wei-yu-650204137/" target="_blank" rel="noopener noreferrer">
          LinkedIn
        </a>
        <a href="mailto:yuxx0752@gmail.com">
          Email
        </a>
      </nav>

      <small>meetmehalfwei.art</small>
    </main>
  </div>
</body>
</html>
