<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wei Yu — Home</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
    min-height: 100vh;
    position: relative;
    display: flex;
    align-items: flex-start;   /* allows shifting downward */
    justify-content: flex-start; /* allows shifting left */
    padding: 120px 160px;      /* ← move everything SW here */
  }

  /* Soft static multi-grey background */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;

    background:
      radial-gradient(circle at 20% 30%, rgba(226,235,209,0.65), rgba(230,230,235,0) 60%),
      radial-gradient(circle at 80% 25%, rgba(216,240,224,0.65), rgba(230,230,235,0) 65%),
      radial-gradient(circle at 30% 75%, rgba(233,235,197,0.65), rgba(230,230,235,0) 65%),
      radial-gradient(circle at 70% 70%, rgba(235,240,255,0.65), rgba(230,230,235,0) 60%),
      linear-gradient(180deg, #e3e5e9 0%, #dcdfe4 100%);
  }

  .bg-layer::before {
    content: "";
    position: absolute;
    inset: -40px;
    pointer-events: none;
    background-image: 
      url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIW2NkYPhfDwAB5gGkz7LxyzAAAAAASUVORK5CYII=');
    opacity: 0.22;
    mix-blend-mode: soft-light;
  }

  .profile-wrapper {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 20px;
  }

  /* Circular profile photo */
  .profile-pic {
    width: 240px;
    height: 240px;
    border-radius: 50%;
    object-fit: cover;
    border: 10px solid rgba(20,20,20,0.65);
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .name {
    font-size: 56px;
    letter-spacing: 0.05em;
    font-weight: 800;
  }

  .subtitle {
    font-size: 16px;
    letter-spacing: 0.1em;
    opacity: 0.75;
    margin-bottom: 20px;
  }

  .section-links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
  }

  .section-links a {
    font-size: 16px;
    text-decoration: none;
    color: #111;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .section-links a:hover {
    opacity: 0.6;
  }

  .contact {
    margin-top: 10px;
    font-size: 15px;
    letter-spacing: 0.05em;
  }

  .contact a {
    text-decoration: none;
    color: #111;
    margin-right: 20px;
  }

  .contact a:hover {
    opacity: 0.6;
  }

  /* Responsive */
  @media (max-width: 700px) {
    body {
      padding: 80px 30px;
    }
    .name { font-size: 38px; }
  }
</style>
</head>
<body>

<div class="bg-layer"></div>

<div class="profile-wrapper">

  <!-- Profile Photo -->
  <img src="img/WeiYuPortrait.jpg" class="profile-pic" alt="Wei Yu">

  <div class="name">WEI YU</div>
  <div class="subtitle">Urban Planner • Analyst • Artist • Designer</div>

  <div class="section-links">
    <a href="#">WORK — AMTRAK</a>
    <a href="#">WORK — MASTERS OF URBAN PLANNING</a>
    <a href="art.html">ART</a>
    <a href="photos.html">PHOTOS</a>
  </div>

  <div class="contact">
    <a href="https://www.linkedin.com/in/robert-wei-yu-650204137/" target="_blank">LinkedIn</a>
    <a href="mailto:yuxx0752@gmail.com">Email: yuxx0752@gmail.com</a>
  </div>

</div>

</body>
</html>
